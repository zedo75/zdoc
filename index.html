<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ZDoc</title>

        <style>
            html,
            body {
                margin: 0;
                height: 100%;
            }

            #app-loading {
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: #888;
                font-size: 14px;
            }

            #app-loading .loader {
                width: 48px;
                height: 48px;
                border: 6px solid #e4e7ed;
                border-top-color: #409eff;
                border-radius: 50%;
                animation: zdoc-spin 0.8s linear infinite;
                margin-bottom: 16px;
            }

            @keyframes zdoc-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <div id="app">
            <div id="app-loading">
                <div class="loader"></div>
                <div>正在加载...</div>
            </div>
        </div>

        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
